[build]
  publish = "dist"
  command = "node scripts/generate-content.js && npm run build"

[build.environment]
  NODE_VERSION = "20"

# Configuración para funciones (crucial para Supabase)
[functions]
  node_bundler = "esbuild"
  directory = "supabase/functions"  # Ajusta según tu estructura

# Assets alojados en la CDN de Lovable (deben ir ANTES del catch-all SPA)
[[redirects]]
  from = "/__l5e/*"
  to = "https://gave-agave-growth.lovable.app/__l5e/:splat"
  status = 200
  force = true

# Redirects para el CMS
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers optimizados
[[headers]]
  for = "/functions/*"  # ¡Nuevo! Para Supabase
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "no-cache"

[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
