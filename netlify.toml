
[build]
  publish = "dist"
  command = "npm run build"

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/content/*"
  to = "/content/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "18"

# Enable Git Gateway for Decap CMS
[template.environment]
  NETLIFY_IDENTITY_WIDGET = "true"

# Netlify Functions
[functions]
  directory = "netlify/functions"

# Headers for static files
[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Headers for admin
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
