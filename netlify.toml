
[build]
  publish = "dist"
  command = "npm run build"

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "18"

# Enable Git Gateway for Decap CMS
[template.environment]
  NETLIFY_IDENTITY_WIDGET = "true"

# Form handling
[[plugins]]
  package = "netlify-plugin-form-submissions"

# Netlify Functions
[functions]
  directory = "netlify/functions"
