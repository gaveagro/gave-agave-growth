
[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"
  NETLIFY_VISUAL_EDITOR = "true"

# Visual Editor Plugin
[[plugins]]
  package = "@netlify/plugin-visual-editor"

# Redirects for Visual Editor
[[redirects]]
  from = "/admin/*"
  to = "/.netlify/functions/cms-proxy/:splat"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for content files
[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Enable Visual Editor for all contexts
[context.production.environment]
  NETLIFY_VISUAL_EDITOR = "true"

[context.deploy-preview.environment]
  NETLIFY_VISUAL_EDITOR = "true"

[context.branch-deploy.environment]
  NETLIFY_VISUAL_EDITOR = "true"
