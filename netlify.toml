[build]
  publish = "dist"
  command = "node scripts/generate-content.js && npm run build"

[build.environment]
  NODE_VERSION = "18"

# Configuración para funciones (crucial para Supabase)
[functions]
  node_bundler = "esbuild"
  directory = "supabase/functions"  # Ajusta según tu estructura

# Redirects para el CMS
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# Landing de hijuelos con OG tags estáticos (para WhatsApp/redes)
[[redirects]]
  from = "/hijuelos-espadin"
  to = "/hijuelos-espadin.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers optimizados
[[headers]]
  for = "/functions/*"  # ¡Nuevo! Para Supabase
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "no-cache"

[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
