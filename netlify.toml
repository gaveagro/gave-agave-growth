
[build]
  publish = "dist"
  command = "npm run build"

# Netlify Visual Editor configuration
[build.environment]
  NODE_VERSION = "18"

# Enable Visual Editor
[[plugins]]
  package = "@netlify/plugin-visual-editor"

# Redirects for Visual Editor
[[redirects]]
  from = "/visual-editor/*"
  to = "/.netlify/functions/visual-editor/:splat"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for content files
[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Access-Control-Allow-Origin = "*"

# Enable Visual Editor features
[context.production.environment]
  NETLIFY_VISUAL_EDITOR = "true"

[context.deploy-preview.environment]
  NETLIFY_VISUAL_EDITOR = "true"
